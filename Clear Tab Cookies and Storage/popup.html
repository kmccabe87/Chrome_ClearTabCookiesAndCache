<!DOCTYPE html>
<html>
<head>
  <title>Clear Tab Data</title>
  <style>
    :root {
      --primary-color: #4CAF50;
      --primary-hover: #45a049;
      --background: #f9f9f9;
      --text-color: #333;
      --shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      --transition: all 0.3s ease;
    }

    body {
      min-width: 250px;
      padding: 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--background);
      color: var(--text-color);
      margin: 0;
      box-shadow: var(--shadow);
      border-radius: 8px;
    }

    h3 {
      margin: 0 0 15px;
      font-size: 1.2em;
      text-align: center;
      color: #555;
    }

    .options {
      margin-bottom: 20px;
    }

    .option {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .option input[type="checkbox"] {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid #ccc;
      border-radius: 4px;
      margin-right: 10px;
      transition: var(--transition);
      position: relative;
    }

    .option input[type="checkbox"]:checked {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
    }

    .option input[type="checkbox"]:checked::after {
      content: '\2714';
      color: white;
      position: absolute;
      top: -2px;
      left: 2px;
      font-size: 14px;
    }

    .option label {
      font-size: 1em;
      user-select: none;
    }

    button {
      padding: 12px;
      width: 100%;
      background: linear-gradient(to bottom, var(--primary-color), #3e8e41);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1em;
      transition: var(--transition);
      box-shadow: var(--shadow);
    }

    button:hover {
      background: linear-gradient(to bottom, var(--primary-hover), #398439);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
    }

    button:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.4);
    }

    #status {
      margin-top: 15px;
      text-align: center;
      color: #666;
      font-size: 0.9em;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    #status.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <h3>Clear Data Options</h3>
  <div class="options">
    <div class="option">
      <input type="checkbox" id="clearCookies" checked>
      <label for="clearCookies">Clear Cookies</label>
    </div>
    <div class="option">
      <input type="checkbox" id="clearLocalStorage" checked>
      <label for="clearLocalStorage">Clear Local Storage</label>
    </div>
    <div class="option">
      <input type="checkbox" id="clearSessionStorage" checked>
      <label for="clearSessionStorage">Clear Session Storage</label>
    </div>
    <div class="option">
      <input type="checkbox" id="refreshTab" checked>
      <label for="refreshTab">Refresh tab after clearing</label>
    </div>
  </div>
  <button id="clearButton">Clear Selected Data</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
